name: Push Code Coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/cloudflare-next-intl/**"
      - "packages/intl/**"
      - "packages/errors/**"
      - "packages/theme/**"
      - "packages/auth/**"
      - "packages/db/**"
      - "packages/db-codegen/**"
    branches:
      - main

concurrency:
  group: generate-code-coverage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cloudflare_next_intl: ${{ steps.filter.outputs.cloudflare_next_intl }}
      intl: ${{ steps.filter.outputs.intl }}
      errors: ${{ steps.filter.outputs.errors }}
      theme: ${{ steps.filter.outputs.theme }}
      auth: ${{ steps.filter.outputs.auth }}
      db: ${{ steps.filter.outputs.db }}
      db_codegen: ${{ steps.filter.outputs.db_codegen }}
    steps:
      - uses: actions/checkout@v4.1.1
      - name: 🕵️ Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cloudflare_next_intl:
              - 'packages/cloudflare-next-intl/**'
            intl:
              - 'packages/intl/**'
            errors:
              - 'packages/errors/**'
            theme:
              - 'packages/theme/**'
            auth:
              - 'packages/auth/**'
            db:
              - 'packages/db/**'
            db_codegen:
              - 'packages/db-codegen/**'

  push_code_coverage_cloudflare_next_intl:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cloudflare_next_intl == 'true' || needs.changes.outputs.intl == 'true' || needs.changes.outputs.errors == 'true' || needs.changes.outputs.theme == 'true' || needs.changes.outputs.auth == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/cloudflare-next-intl
      test_path: src
      min_coverage: 100
      min_overall_coverage: 99
      per_file_exceptions: |
        config/middleware.ts:93
        errors_board/client/error_detail_view.tsx:96
        vite/auto_dynamic_pages_plugin.ts:98
        vite/auto_locale_params_plugin.ts:98
        locale_params_check/insert_locale_params.ts:97
        vite/vinext_route_wiring_fix.ts:98
        cookie_consent/client/components/cookie_consent_dialog.tsx:98
        cookie_consent/client/components/privacy_policy_update_dialog.tsx:98
      send_notifications: false

  push_code_coverage_intl:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.intl == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/intl
      test_path: src
      min_coverage: 100
      min_overall_coverage: 99
      per_file_exceptions: |
        general/general_functions.ts:87
      send_notifications: false

  push_code_coverage_errors:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.errors == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/errors
      test_path: src
      min_coverage: 100
      min_overall_coverage: 100
      send_notifications: false

  push_code_coverage_theme:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.theme == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/theme
      test_path: src
      min_coverage: 100
      min_overall_coverage: 100
      send_notifications: false

  push_code_coverage_auth:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.auth == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/auth
      test_path: src
      min_coverage: 100
      min_overall_coverage: 96
      per_file_exceptions: |
        firebase_auth_check/check_firebase_auth_config.ts:96
        firebase_auth/client/auth_user_provider.tsx:92
        firebase_auth/client/device_key.ts:88
        firebase_auth/client/firebase_client.ts:98
        firebase_auth/client/session_sync.ts:87
        firebase_auth/device_proof.ts:98
        firebase_auth/guarded_refresh.ts:88
        firebase_auth/middleware/update_session.ts:98
        firebase_auth/server/clear_session_action.ts:93
        firebase_auth/server/restore_session_action.ts:88
      send_notifications: false

  push_code_coverage_db:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.db == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/db
      test_path: src
      min_coverage: 100
      min_overall_coverage: 100
      send_notifications: false

  push_code_coverage_db_codegen:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.db_codegen == 'true' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_push_code_coverage.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: packages/db-codegen
      test_path: src
      min_coverage: 100
      min_overall_coverage: 100
      send_notifications: false

  notify:
    if: always()
    needs:
      - push_code_coverage_cloudflare_next_intl
      - push_code_coverage_intl
      - push_code_coverage_errors
      - push_code_coverage_theme
      - push_code_coverage_auth
      - push_code_coverage_db
      - push_code_coverage_db_codegen
    uses: demian-ilnytskyi/workflows/.github/workflows/notification.yml@main
    secrets: inherit
    with:
      job_status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      workflow: ${{ github.workflow }}
      dop_text: "cloudflare-next-intl ${{ needs.push_code_coverage_cloudflare_next_intl.result }}, intl ${{ needs.push_code_coverage_intl.result }}, errors ${{ needs.push_code_coverage_errors.result }}, theme ${{ needs.push_code_coverage_theme.result }}, auth ${{ needs.push_code_coverage_auth.result }}, db ${{ needs.push_code_coverage_db.result }}, db-codegen ${{ needs.push_code_coverage_db_codegen.result }}"
