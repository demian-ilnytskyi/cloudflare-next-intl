name: CI - Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package/**"
    branches: [main]

concurrency:
  group: ci-$
  cancel-in-progress: true

jobs:
  build_tests:
    uses: demian-ilnytskyi/workflows/.github/workflows/package_ci_build_and_test.yml@main
    secrets: inherit
    with:
      project_type: nextjs
      working_directory: package
      test_path: src
      min_coverage: 100
      run_bench: true
