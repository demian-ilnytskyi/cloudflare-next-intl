name: CD - Publish Package

on:
  workflow_dispatch:
    inputs:
      publish_cloudflare_next_intl:
        description: "Publish cloudflare-next-intl package"
        type: boolean
        default: true
      publish_intl:
        description: "Publish intl package"
        type: boolean
        default: false
      publish_errors:
        description: "Publish errors package"
        type: boolean
        default: false
      publish_theme:
        description: "Publish theme package"
        type: boolean
        default: false
      publish_auth:
        description: "Publish auth package"
        type: boolean
        default: false
      publish_db:
        description: "Publish db package"
        type: boolean
        default: false
      publish_db_codegen:
        description: "Publish db-codegen package"
        type: boolean
        default: false

concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish_cloudflare_next_intl:
    needs: [publish_intl, publish_errors, publish_theme, publish_auth]
    if: ${{ always() && inputs.publish_cloudflare_next_intl && needs.publish_intl.result != 'failure' && needs.publish_intl.result != 'cancelled' && needs.publish_errors.result != 'failure' && needs.publish_errors.result != 'cancelled' && needs.publish_theme.result != 'failure' && needs.publish_theme.result != 'cancelled' && needs.publish_auth.result != 'failure' && needs.publish_auth.result != 'cancelled' }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/cloudflare-next-intl
      send_notifications: false

  publish_intl:
    if: ${{ inputs.publish_intl }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/intl
      send_notifications: false

  publish_errors:
    if: ${{ inputs.publish_errors }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/errors
      send_notifications: false

  publish_theme:
    if: ${{ inputs.publish_theme }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/theme
      send_notifications: false

  publish_auth:
    if: ${{ inputs.publish_auth }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/auth
      send_notifications: false

  publish_db:
    if: ${{ inputs.publish_db }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/db
      send_notifications: false

  publish_db_codegen:
    if: ${{ inputs.publish_db_codegen }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/db-codegen
      send_notifications: false

  notify:
    if: always()
    needs:
      - publish_cloudflare_next_intl
      - publish_intl
      - publish_errors
      - publish_theme
      - publish_auth
      - publish_db
      - publish_db_codegen
    uses: demian-ilnytskyi/workflows/.github/workflows/notification.yml@main
    secrets: inherit
    with:
      job_status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      workflow: ${{ github.workflow }}
      dop_text: "cloudflare-next-intl ${{ inputs.publish_cloudflare_next_intl && needs.publish_cloudflare_next_intl.result || 'skipped' }}, intl ${{ inputs.publish_intl && needs.publish_intl.result || 'skipped' }}, errors ${{ inputs.publish_errors && needs.publish_errors.result || 'skipped' }}, theme ${{ inputs.publish_theme && needs.publish_theme.result || 'skipped' }}, auth ${{ inputs.publish_auth && needs.publish_auth.result || 'skipped' }}, db ${{ inputs.publish_db && needs.publish_db.result || 'skipped' }}, db-codegen ${{ inputs.publish_db_codegen && needs.publish_db_codegen.result || 'skipped' }}"
