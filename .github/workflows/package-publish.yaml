name: CD - Publish Package

on:
  workflow_dispatch:

concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish_cloudflare_next_intl:
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/cloudflare-next-intl
      send_notifications: false

  publish_db:
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/db
      send_notifications: false

  notify:
    if: always()
    needs:
      - publish_cloudflare_next_intl
      - publish_db
    uses: demian-ilnytskyi/workflows/.github/workflows/notification.yml@main
    secrets: inherit
    with:
      job_status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      workflow: ${{ github.workflow }}
      dop_text: "cloudflare-next-intl ${{ needs.publish_cloudflare_next_intl.result }}, db ${{ needs.publish_db.result }}"
