name: CD - Publish Package

on:
  workflow_dispatch:
    inputs:
      publish_cloudflare_next_intl:
        description: "Publish cloudflare-next-intl package"
        type: boolean
        default: true
      publish_db:
        description: "Publish db package"
        type: boolean
        default: false
      publish_db_codegen:
        description: "Publish db-codegen package"
        type: boolean
        default: false

concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish_cloudflare_next_intl:
    if: ${{ inputs.publish_cloudflare_next_intl }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/cloudflare-next-intl
      send_notifications: false

  publish_db:
    if: ${{ inputs.publish_db }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/db
      send_notifications: false

  publish_db_codegen:
    if: ${{ inputs.publish_db_codegen }}
    uses: demian-ilnytskyi/workflows/.github/workflows/package_publish.yml@main
    secrets: inherit
    with:
      working_directory: packages/db-codegen
      send_notifications: false

  notify:
    if: always()
    needs:
      - publish_cloudflare_next_intl
      - publish_db
      - publish_db_codegen
    uses: demian-ilnytskyi/workflows/.github/workflows/notification.yml@main
    secrets: inherit
    with:
      job_status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      workflow: ${{ github.workflow }}
      dop_text: "cloudflare-next-intl ${{ inputs.publish_cloudflare_next_intl && needs.publish_cloudflare_next_intl.result || 'skipped' }}, db ${{ inputs.publish_db && needs.publish_db.result || 'skipped' }}, db-codegen ${{ inputs.publish_db_codegen && needs.publish_db_codegen.result || 'skipped' }}"
